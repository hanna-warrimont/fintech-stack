# CI: Jeder PR und jeder Push auf main baut alles und lässt alle Tests laufen –
# auch die Testcontainers-Tests (Kafka, Postgres): Ubuntu-Runner bringen Docker mit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Neuer Push auf denselben Branch bricht den alten Lauf ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Portal.slnx -c Release
      - run: dotnet test tests/Portal.Tests -c Release --no-build

  frontend:
    name: Nuxt lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/Frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # wie im Dockerfile und in package.json (engines)
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json
      - run: npm ci # postinstall: nuxt prepare erzeugt .nuxt (Typen, ESLint-Konfiguration)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  bicep:
    name: Bicep lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Linter-Regeln mit level "error" in infra/bicepconfig.json lassen den Job scheitern. Kein Azure-Login nötig.
      - run: az bicep install
      - run: az bicep lint --file infra/main.bicep
